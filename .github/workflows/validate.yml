name: Validate FastBuyJSON

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate schemas and examples
        run: python scripts/validate_schemas.py

      - name: Check OpenAPI drift
        run: python scripts/build_openapi.py --check

      - name: Validate OpenAPI spec
        run: openapi-spec-validator openapi/fastbuyjson.yaml

      - name: Check version alignment
        run: python scripts/check_versions.py

      - name: Run Python API tests
        run: python -m pytest tests/test_python_server.py conformance/harness/python

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install

      - name: Syntax-check demo server
        run: node --check src/server.js && node --check src/commerce.js && node --check src/auth.js && node --check src/errors.js && node --check src/idempotency.js && node --check src/validation.js && node --check src/extensions.js

      - name: Run Node API tests
        run: npm test

      - name: Install SDK dependencies
        run: npm run sdk:install

      - name: Check SDK type generation drift
        run: npm run check:sdk-types

      - name: Install MCP server dependencies
        run: npm run mcp:install

      - name: Build MCP server
        run: npm run mcp:build

      - name: Run MCP tests
        run: npm run mcp:test
